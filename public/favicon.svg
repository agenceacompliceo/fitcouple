<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fond -->
  <rect width="64" height="64" fill="#111" rx="12"/>

  <!-- Adam (gauche) — plus grand, cheveux bouclés -->
  <!-- Corps -->
  <rect x="8" y="30" width="10" height="16" rx="3" fill="white"/>
  <!-- Tête -->
  <circle cx="13" cy="24" r="7" fill="#D4A574"/>
  <!-- Cheveux bouclés -->
  <circle cx="9" cy="20" r="3.5" fill="#2C1810"/>
  <circle cx="13" cy="17.5" r="3.5" fill="#2C1810"/>
  <circle cx="17" cy="20" r="3.5" fill="#2C1810"/>
  <circle cx="10" cy="23" r="2.5" fill="#2C1810"/>
  <circle cx="16" cy="23" r="2.5" fill="#2C1810"/>
  <!-- Jambes -->
  <rect x="8" y="44" width="4" height="8" rx="2" fill="#1a1a1a"/>
  <rect x="14" y="44" width="4" height="8" rx="2" fill="#1a1a1a"/>
  <!-- Bras -->
  <rect x="3" y="31" width="4" height="10" rx="2" fill="#D4A574"/>
  <rect x="19" y="31" width="4" height="10" rx="2" fill="#D4A574"/>

  <!-- Andréa (droite) — plus petite, métisse, cheveux lisses longs -->
  <!-- Corps -->
  <rect x="40" y="33" width="10" height="14" rx="3" fill="white"/>
  <!-- Tête -->
  <circle cx="45" cy="27" r="6" fill="#C68642"/>
  <!-- Cheveux lisses longs -->
  <rect x="38" y="22" width="14" height="18" rx="4" fill="#1a0a00"/>
  <rect x="39" y="23" width="12" height="6" rx="3" fill="#C68642"/>
  <!-- Jambes -->
  <rect x="40" y="45" width="3.5" height="7" rx="2" fill="#1a1a1a"/>
  <rect x="46" y="45" width="3.5" height="7" rx="2" fill="#1a1a1a"/>
  <!-- Bras -->
  <rect x="35" y="34" width="4" height="9" rx="2" fill="#C68642"/>
  <rect x="51" y="34" width="4" height="9" rx="2" fill="#C68642"/>
</svg>
